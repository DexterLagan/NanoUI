  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <circle cx="256" cy="250" r="150" fill="url(#halo)"/>

  <g filter="url(#shadow)">
    <path d="M 168 344 A 192 192 0 0 1 362 150"
