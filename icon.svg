<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2822"/>
      <stop offset="1" stop-color="#131110"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.28" r="0.65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD54F" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFD54F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="banana" x1="0.2" y1="0" x2="0.85" y2="1">
